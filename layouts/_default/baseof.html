<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    (function(){
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Summary | plainify | truncate 160 }}{{ end }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "icons/favicon-16x16.png" | absURL }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "icons/favicon-32x32.png" | absURL }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ "icons/favicon-192x192.png" | absURL }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "icons/apple-touch-icon.png" | absURL }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ "css/main.css" | absURL }}">
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>
<div class="dotfield"></div>
<div id="top"></div>

<header class="chrome">
  <a class="chrome-mark mono" href="{{ "/" | relURL }}">amalchandran.xyz</a>
  <div class="chrome-right">
    <nav class="chrome-nav mono" aria-label="Primary">
      {{ range .Site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
    </nav>
    <button type="button" class="theme-toggle mono" id="themeToggle" aria-pressed="false">Dark</button>
  </div>
</header>

<main id="main-content">
  {{ block "main" . }}{{ end }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="mono">&copy; {{ now.Year }} Amal Chandran. Built with equal parts terminal and turpentine.</p>
  </div>
</footer>

<script src="{{ "js/main.js" | absURL }}"></script>
</body>
</html>
