{{ define "main" }}
<div id="content" class="wrap page">
  <div class="grid">
    <header class="page-head">
      <h1 class="page-title">{{ .Title }}</h1>
      {{- with .Content }}<div class="page-lead">{{ . }}</div>{{ end }}
    </header>
  </div>
  {{- partial "posts-by-year.html" .RegularPages }}
</div>
{{ end }}
