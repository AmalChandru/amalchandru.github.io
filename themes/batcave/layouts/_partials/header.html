<header>
  <a class="skip" href="#content">Skip to content</a>
  <div class="wrap">
    <a class="wordmark" href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ site.Title }}</a>
    <button class="menu-button" type="button" popovertarget="menu">
      <span class="visually-hidden">Menu</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="open" d="M4 7h16M4 12h16M4 17h16"/><path class="close" d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="menu" id="menu" popover>
      <nav class="nav" aria-label="Main">
        {{- $page := . }}
        {{- range site.Menus.main }}
        <a href="{{ .URL }}"{{ if or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{- end }}
      </nav>
      <div class="menu-foot">
        {{- range site.Params.social }}
        <a href="{{ .url | relURL }}">{{ .name }}</a>
        {{- end }}
      </div>
    </div>
  </div>
</header>
