baseURL = "https://amalchandran.xyz/"
locale = "en-us"
title = "Amal Chandran M V"
theme = "batcave"

enableRobotsTXT = true
enableGitInfo = true
# Keep tag names as written (lowercase) instead of Title Casing them.
capitalizeListTitles = false

[taxonomies]
  tag = "tags"

# Last-updated dates: explicit front matter wins, then the last git commit,
# then the file's modification time (covers uncommitted edits).
[frontmatter]
  lastmod = ["lastmod", ":git", ":fileModTime"]

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[services.rss]
  limit = 20

[params]
  description = "Amal Chandran M V. Beep boop engineer, full-time human. Software, systems, electronics and the occasional sketch."
  author = "Amal Chandran M V"
  footerLine = "Built from the Batcave."
  # Where "Ping me" and "Tell me" links point.
  contact = "https://www.linkedin.com/in/amal-chandran-m-v/"
  # Hide the "Updated" date in Lately once it is older than this many days.
  latelyStaleDays = 90

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/AmalChandru"
  [[params.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/amal-chandran-m-v/"
  [[params.social]]
    name = "RSS"
    url = "/journals/index.xml"

[[menus.main]]
  name = "Journals"
  pageRef = "/journals"
  weight = 10
[[menus.main]]
  name = "Talks"
  pageRef = "/talks"
  weight = 20
[[menus.main]]
  name = "Self"
  pageRef = "/self"
  weight = 30
